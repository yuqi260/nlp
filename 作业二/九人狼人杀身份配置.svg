<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>text{font-family:'Microsoft YaHei','微软雅黑',sans-serif}</style><rect width="1920" height="1080" fill="white"/>
<text x="80" y="94" fill="#07549C" font-size="52" font-weight="700" text-anchor="start">九人狼人杀 · 身份配置</text>
<text x="82" y="150" fill="#526176" font-size="26" font-weight="400" text-anchor="start">预言家 1 人  ·  女巫 1 人  ·  猎人 1 人  ·  平民 3 人  ·  狼人 3 人</text>
