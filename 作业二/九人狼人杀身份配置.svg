<text x="1556" y="535" fill="#A33742" font-size="38" font-weight="700" text-anchor="middle">狼人 × 3</text>
<text x="1556" y="600" fill="#192B42" font-size="25" font-weight="400" text-anchor="middle">夜间共同选择袭击目标</text>
<text x="1556" y="642" fill="#192B42" font-size="25" font-weight="400" text-anchor="middle">白天隐藏身份、参与讨论</text>
<path d="M1312 700H1800" stroke="#E5C7CC" stroke-width="2"/>
<text x="1556" y="770" fill="#A33742" font-size="26" font-weight="600" text-anchor="middle">同属一个阵营</text>
<text x="1556" y="815" fill="#192B42" font-size="25" font-weight="400" text-anchor="middle">通常互相知道身份</text>
<text x="80" y="985" fill="#07549C" font-size="27" font-weight="600" text-anchor="start">所有角色都会发言和投票；公开声明的身份不一定是真实身份。</text>
<text x="80" y="1034" fill="#526176" font-size="19" font-weight="400" text-anchor="start">注：女巫用药限制、猎人技能触发条件等，以具体对局规则为准。</text>
</svg>