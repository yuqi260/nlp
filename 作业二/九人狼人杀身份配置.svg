<text x="660" y="550" fill="#192B42" font-size="24" font-weight="400" text-anchor="middle">拥有一瓶解药</text>
<text x="660" y="588" fill="#192B42" font-size="24" font-weight="400" text-anchor="middle">和一瓶毒药</text>
