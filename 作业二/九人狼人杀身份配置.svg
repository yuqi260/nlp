<text x="300" y="550" fill="#192B42" font-size="24" font-weight="400" text-anchor="middle">每晚可查验一名玩家</text>
<text x="300" y="588" fill="#192B42" font-size="24" font-weight="400" text-anchor="middle">得知其是好人还是狼人</text>
