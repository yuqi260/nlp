<text x="1020" y="500" fill="#07549C" font-size="34" font-weight="700" text-anchor="middle">猎人 × 1</text>
<text x="1020" y="550" fill="#192B42" font-size="24" font-weight="400" text-anchor="middle">符合条件出局时</text>
<text x="1020" y="588" fill="#192B42" font-size="24" font-weight="400" text-anchor="middle">可开枪带走一人</text>
